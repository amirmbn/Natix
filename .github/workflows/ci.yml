name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-vet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./cmd/natix
      - run: go build ./cmd/natix-engine
      - run: shellcheck scripts/*.sh
